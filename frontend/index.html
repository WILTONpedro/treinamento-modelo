<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Escritório de Recrutamento</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header id="topo">
  <div class="logo oculto" id="marca"><b data-marca="sigla"></b><span data-marca="nome"></span></div>
  <nav id="ferramentas"></nav>
  <div id="usuario"></div>
</header>
<div id="avisobanco" class="oculto" role="alert" aria-live="assertive"></div>
<main id="principal">
  <section id="esq">
    <div id="palco"><canvas id="cn"></canvas></div>
    <div id="bancow"></div>
    <div id="cvw"></div>
  </section>
  <aside id="painel"><div id="pi"></div></aside>
</main>
<div id="atividade" class="oculto" role="dialog" aria-label="Atividade recente"></div>
<div id="legenda" class="oculto"></div>
<div id="dica"></div>
<div id="modal"></div>
<div id="login" class="oculto">
  <form class="caixa" id="flogin" autocomplete="on">
    <canvas id="login-avatar" width="72" height="72"></canvas>
    <h2 id="login-titulo">Entrar</h2>
    <p class="mini" id="login-sub">Escritório de recrutamento</p>
    <label class="campo">E-mail<input id="lemail" type="email" required autocomplete="username"></label>
    <label class="campo">Senha<input id="lsenha" type="password" required autocomplete="current-password"></label>
    <div class="erro" id="lerro"></div>
    <button class="btn" style="width:100%;padding:10px">Entrar</button>
    <p class="aviso">Acesso restrito à equipe de RH. Os acessos a currículos ficam registrados (LGPD).</p>
  </form>
</div>
<script src="cena.js"></script>
<script src="app.js"></script>
</body>
</html>
