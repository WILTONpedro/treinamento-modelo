# Produção num servidor com Docker: API + HTTPS automático (Caddy) e o banco:
#   - no Supabase (recomendado): python -m app.preparar --docker --supabase "postgresql://..." ...
#   - ou um PostgreSQL próprio aqui (perfil banco-local): python -m app.preparar --docker ...
#   1) cd backend && python -m app.preparar --docker --dominio rh.suaempresa.com.br --gemini-key ...
#   2) aponte o DNS do domínio para este servidor e libere as portas 80 e 443
#   3) docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    # O app só aceita X-Forwarded-For vindo do Caddy (IP fixo abaixo), não de qualquer um: senão o cliente
    # escolheria o próprio IP e burlaria o limite de login e a auditoria.
    environment:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.29.0.2}
    volumes:
      - dados:/dados               # currículos cifrados (quando ARMAZENAMENTO=disco)
    depends_on:
      db:
        condition: service_healthy
        required: false            # com o banco no Supabase o serviço db não sobe
    networks: [interna]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: ["banco-local"]      # ativado por COMPOSE_PROFILES=banco-local no .env
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [interna]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - app
    # IP fixo: é o único endereço de onde o app aceita X-Forwarded-For (veja FORWARDED_ALLOW_IPS).
    networks:
      interna:
        ipv4_address: 172.29.0.2
    restart: unless-stopped

# Rede interna com faixa fixa, só para o Caddy ter um IP previsível. Se 172.29.0.0/24 colidir com algo no
# servidor, troque aqui e em FORWARDED_ALLOW_IPS (app) / ipv4_address (caddy).
networks:
  interna:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  dados:
  banco:
  caddy_dados:
  caddy_config:
