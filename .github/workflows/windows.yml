# Gera o instalador do Escritório de Recrutamento para Windows e o testa num Windows de verdade:
# testes do sistema, programa (PyInstaller), instalador (Inno Setup), instalação silenciosa e o escritório no ar.
# O instalador fica em "Artifacts" na página da execução (Actions).
name: Instalador Windows

on:
  push:
    branches: [main, "claude/**"]
    paths: ["backend/**", "frontend/**", "windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install -r backend/requirements-dev.txt pyinstaller==6.11.1

      - name: Testes do sistema (no Windows)
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

      - name: Programa (PyInstaller)
        run: pyinstaller --noconfirm windows/escritorio.spec

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc windows\escritorio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou" }

      - name: Instala sem perguntas e abre o escritório
        shell: pwsh
        timeout-minutes: 10  # um aviso esperando clique num instalador silencioso trava para sempre
        run: |
          # como vai para uma empresa: o kit do fornecedor (NovaEmpresa.exe) prepara a configuração lacrada e mostra o
          # código de ativação. Empresa de teste: banco local (SQLite) e IA de demonstração, nada sai da máquina.
          $empresas = Join-Path $env:RUNNER_TEMP "empresas"
          $saida = & dist\NovaEmpresa.exe "Empresa do Teste" --demonstracao --pasta $empresas
          if ($LASTEXITCODE -ne 0) { $saida; throw "o kit do fornecedor falhou" }
          $pacote = Join-Path $empresas "empresa_do_teste\empresa_do_teste.escritorio"
          if (-not (Test-Path $pacote)) { throw "o kit do fornecedor não gerou o pacote" }
          if (Select-String -Path $pacote -Pattern "SEGREDO_JWT" -Quiet) { throw "o pacote está legível" }
          $codigo = ([regex]::Match(($saida -join "`n"), "[A-Z0-9]{4}(-[A-Z0-9]{4}){4}")).Value
          if (-not $codigo) { throw "o código de ativação não apareceu" }
          $pastaCfg = Join-Path $env:APPDATA "EscritorioRecrutamento"
          $instalador = "dist-instalador\EscritorioRecrutamento-Setup.exe"

          # código errado: nada é instalado nem guardado
          $p = Start-Process -Wait -PassThru -FilePath $instalador `
                 -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CONFIG=`"$pacote`"", "/CODIGO=AAAA-AAAA-AAAA-AAAA-AAAA"
          if ($p.ExitCode -eq 0) { throw "instalou com o código errado" }
          if (Test-Path (Join-Path $pastaCfg "escritorio.cfg")) { throw "guardou a configuração com o código errado" }

          # código certo (minúsculo e sem traços também vale)
          $p = Start-Process -Wait -PassThru -FilePath $instalador `
                 -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CONFIG=`"$pacote`"", "/CODIGO=$($codigo.ToLower().Replace('-', ''))"
          if ($p.ExitCode -ne 0) { throw "instalação falhou ($($p.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\EscritorioRecrutamento\EscritorioRecrutamento.exe"
          if (-not (Test-Path $exe)) { throw "o programa não foi instalado" }
          if (Test-Path (Join-Path (Split-Path $exe) "NovaEmpresa.exe")) { throw "o kit do fornecedor foi junto para a empresa" }
          if (-not (Test-Path (Join-Path $pastaCfg "escritorio.cfg"))) { throw "a configuração lacrada não foi guardada" }
          if (Test-Path (Join-Path $pastaCfg "escritorio.env")) { throw "ficou uma configuração legível no computador" }
          if (Select-String -Path (Join-Path $pastaCfg "escritorio.cfg") -Pattern "SEGREDO_JWT" -Quiet) { throw "a configuração guardada está legível" }
          foreach ($atalho in @("Desktop", "Startup")) {
            $pasta = [Environment]::GetFolderPath($atalho)
            if (-not (Get-ChildItem $pasta -Filter "Escrit*rio de Recrutamento*.lnk")) { throw "faltou o atalho em $atalho" }
          }

          Start-Process -FilePath $exe -ArgumentList "--sem-janela"
          $ok = $false
          foreach ($i in 1..90) {
            try { $r = Invoke-WebRequest "http://127.0.0.1:8765/api/marca" -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
            Start-Sleep -Seconds 1
          }
          $log = Join-Path $env:LOCALAPPDATA "EscritorioRecrutamento\dados\escritorio.log"
          if (-not $ok) { if (Test-Path $log) { Get-Content $log -Tail 60 }; throw "o escritório não abriu" }

          $eu = Invoke-RestMethod "http://127.0.0.1:8765/auth/eu"
          Write-Host "Recrutador deste computador (sem login): $($eu.nome) <$($eu.email)>"
          $pagina = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing
          if ($pagina.StatusCode -ne 200) { throw "a página do escritório não abriu" }
          # a tela instalada é a desta versão (e o navegador não reaproveita a de uma versão anterior)
          $m = [regex]::Match($pagina.Content, 'app\.js\?v=([0-9a-f]+)')
          if (-not $m.Success) { throw "a página não traz a versão nos arquivos" }
          $js = Invoke-WebRequest "http://127.0.0.1:8765/app.js?v=$($m.Groups[1].Value)" -UseBasicParsing
          if ($js.Content -notmatch 'abrirBanco') { throw "o programa instalado está com a tela antiga" }
          if ($js.Headers['Cache-Control'] -ne 'no-cache') { throw "a tela pode ficar guardada no navegador" }
          curl.exe -s -f -H "X-Hub: 1" -F "arquivos=@backend/demo/02_joao_pereira.txt;type=text/plain" http://127.0.0.1:8765/api/curriculos
          if ($LASTEXITCODE -ne 0) { throw "o envio de currículo falhou" }
          Start-Sleep -Seconds 8
          $quadro = (Invoke-RestMethod "http://127.0.0.1:8765/api/escritorio").quadro
          Write-Host "Quadro: $($quadro | ConvertTo-Json -Compress)"
          Stop-Process -Name EscritorioRecrutamento -Force
          Get-Content $log -Tail 25
          if (Select-String -Path $log -Pattern "Traceback" -Quiet) { throw "erro no registro do programa" }

      - name: Desinstala
        shell: pwsh
        run: |
          $u = Join-Path $env:LOCALAPPDATA "Programs\EscritorioRecrutamento\unins000.exe"
          $p = Start-Process -Wait -PassThru -FilePath $u -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($p.ExitCode -ne 0) { throw "desinstalação falhou" }

      - uses: actions/upload-artifact@v4
        with:
          name: EscritorioRecrutamento-Setup
          path: dist-instalador/EscritorioRecrutamento-Setup.exe
          retention-days: 30

      # só para quem vende: prepara cada empresa nova (não vai para as empresas)
      - uses: actions/upload-artifact@v4
        with:
          name: Ferramentas-do-fornecedor
          path: dist/NovaEmpresa.exe
          retention-days: 30
